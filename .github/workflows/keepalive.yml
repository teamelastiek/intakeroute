# Houdt het gratis Supabase-project wakker: dat pauzeert na 7 dagen zonder activiteit.
# Elke 3 dagen één klein verzoek aan de database. Er worden geen gegevens gelezen.
name: Supabase wakker houden

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Database pingen
        env:
          # Dezelfde openbare waarden als in config.js
          SUPABASE_URL: https://qgalhxsvmfungindagqk.supabase.co
          SUPABASE_KEY: sb_publishable_VkNgAQH-gNdON3rc4qbNVw_Cu4IJZtO
        run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'

      # GitHub zet geplande taken uit na 60 dagen zonder wijzigingen in de repository.
      # Door de taak hier opnieuw aan te zetten, blijft hij doorlopen.
      - name: Taak actief houden
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
