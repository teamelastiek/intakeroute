<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Intakeroute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: een bord met een kolom per fase; elk dossier is een kaart met routestrook; openen geeft een lade met de metrolijn van het dossier */
:root{
  --bg:#EDF1F0; --col:#E2E8E6; --surface:#FFFFFF; --surface-2:#F4F7F6;
  --ink:#13201E; --muted:#56655F; --line:#D2DAD8; --line-strong:#AEBBB8;
  --accent:#0E5A55; --accent-ink:#FFFFFF; --accent-soft:#D3E7E3;
  --wait:#C27A12; --wait-ink:#7F4E06; --wait-soft:#F8E8CC;
  --alert:#B42318; --alert-soft:#FBE3DF;
  --scrim:rgba(12,20,19,.45);
  --shadow:0 1px 2px rgba(19,32,30,.06),0 6px 18px rgba(19,32,30,.07);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1413; --col:#121C1B; --surface:#172221; --surface-2:#1C2928;
  --ink:#E3ECEA; --muted:#94A6A2; --line:#2A3937; --line-strong:#3E504D;
  --accent:#4DB3A8; --accent-ink:#0A1716; --accent-soft:#1C3633;
  --wait:#E3A64A; --wait-ink:#F2C47E; --wait-soft:#3A2C15;
  --alert:#F0806F; --alert-soft:#3F201B;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1413; --col:#121C1B; --surface:#172221; --surface-2:#1C2928;
  --ink:#E3ECEA; --muted:#94A6A2; --line:#2A3937; --line-strong:#3E504D;
  --accent:#4DB3A8; --accent-ink:#0A1716; --accent-soft:#1C3633;
  --wait:#E3A64A; --wait-ink:#F2C47E; --wait-soft:#3A2C15;
  --alert:#F0806F; --alert-soft:#3F201B;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
code{font-family:var(--f-mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.userbar{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.userbar b{color:var(--ink);font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.form-error{color:var(--alert);font-size:13.5px;font-weight:600}
.auth{min-height:100vh;display:grid;place-items:center;padding-inline:16px;padding-block:32px}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow);display:grid;gap:16px}
.auth-card h1{font-size:30px}
.auth-card p{color:var(--muted)}
.auth-form{display:grid;gap:14px}
.auth-form .btn{justify-self:start}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.86em}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1480px;margin:0 auto;padding-inline:clamp(16px,3vw,36px);padding-block:28px 72px;display:grid;gap:22px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
.brand h1{font-size:clamp(28px,4vw,38px);font-weight:700;line-height:1.05}
.brand p{color:var(--muted);margin-top:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-weight:600;font-size:14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--alert);border-color:var(--alert)}
.btn.danger.solid{background:var(--alert);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}

/* summary */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:grid;gap:2px}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .s{font-size:12.5px;color:var(--muted)}
.stat .s.late{color:var(--alert);font-weight:600}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.input,.select,textarea.input{font:inherit;font-size:14px;padding:8px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
.toolbar .input{width:min(300px,100%)}
.toolbar .select{width:auto;max-width:100%}
.check{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:8px;border-radius:2px;background:var(--line);display:inline-block}
.legend i.k{background:var(--accent)} .legend i.b{background:var(--wait)} .legend i.n{background:var(--accent-soft)}

/* board */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;align-items:start}
.column{background:var(--col);border-radius:12px;padding:12px;display:grid;gap:10px;min-width:0}
.column.finish{background:var(--accent-soft)}
.col-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 4px 4px}
.col-head h2{font-size:17px;font-weight:600}
.count{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);background:var(--surface);border-radius:999px;padding:1px 9px}
.col-empty{font-size:13px;color:var(--muted);padding:10px 6px;border:1px dashed var(--line-strong);border-radius:8px;text-align:center}

.card{display:grid;gap:9px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease;min-width:0}
.card:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.card.archived{opacity:.6}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.card h3{font-size:16.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.people{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.card-foot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;color:var(--muted)}
.card-foot .next{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pct{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}

.strip{display:flex;gap:6px}
.pgrp{display:flex;gap:2px;flex:var(--n) 1 0;min-width:0}
.pip{flex:1;height:8px;border-radius:2px;background:var(--line)}
.pip.s-klaar{background:var(--accent)}
.pip.s-bezig{background:var(--wait)}
.pip.s-nvt{background:var(--accent-soft)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.soon{background:var(--wait-soft);color:var(--wait-ink)}
.chip.late{background:var(--alert-soft);color:var(--alert)}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.ex{background:var(--wait-soft);color:var(--wait-ink)}

/* empty & notices */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,3vw,28px);display:grid;gap:14px}
.panel h2{font-size:22px}
.panel p{max-width:62ch;color:var(--muted)}
.notice{font-size:13.5px;background:var(--wait-soft);color:var(--wait-ink);border-radius:8px;padding:8px 12px}

/* route (metrolijn) */
.route{display:flex;gap:12px;align-items:flex-start}
.rp{flex:var(--n) 1 0}
.rtrack{display:flex;height:32px}
.st{flex:1;position:relative;display:grid;place-items:center;background:none;border:0;padding:0;min-width:20px;cursor:pointer}
span.st{cursor:default}
.st::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;transform:translateY(-50%);background:var(--line)}
.rp .st:first-child::before{left:50%}
.rp .st:last-child::before{right:50%}
.st.s-klaar::before{background:var(--accent)}
.st.s-nvt::before{background:var(--accent-soft)}
.s-nvt .dot{border-style:dashed;background:var(--surface-2)}
.dot{position:relative;width:15px;height:15px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong);transition:transform .12s ease}
.s-klaar .dot{background:var(--accent);border-color:var(--accent)}
.s-bezig .dot{background:var(--wait);border-color:var(--wait)}
.st.cur .dot{width:21px;height:21px;border-width:3px;border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
button.st:hover .dot{transform:scale(1.25)}
.rlabel{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:4px;line-height:1.3}
.rlabel span:first-child{font-weight:600;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.rfin{flex:0 0 auto;display:grid;justify-items:center;width:74px}
.rfin .rtrack{align-items:center}
.flag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:2px solid var(--line-strong);color:var(--muted);border-radius:6px;padding:2px 7px;background:var(--surface)}
.rfin.on .flag{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rfin .rlabel{border:0;justify-content:center;text-align:center}
.route.big .rtrack{height:46px}
.route.big .st::before{height:6px}
.route.big .dot{width:20px;height:20px}
.route.big .st.cur .dot{width:28px;height:28px;box-shadow:0 0 0 7px var(--accent-soft)}
.route.big .rlabel{font-size:13.5px}
@media (prefers-reduced-motion: no-preference){
  .st.cur .dot{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 9px var(--accent-soft)}}
}
@media (max-width:560px){
  .route{gap:6px}
  .rfin{width:48px}
  .rfin .rlabel{display:none}
  .rlabel{flex-direction:column;gap:0}
}

/* overlay / sheet */
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;justify-content:flex-end;z-index:50}
.sheet{background:var(--bg);width:min(900px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);padding-inline:clamp(16px,3.5vw,36px);padding-top:calc(env(safe-area-inset-top,0px) + 22px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.sheet.meeting{width:100%}
.sheet-inner{display:grid;gap:24px;max-width:1200px;margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.sheet-head h2{font-size:clamp(24px,3.4vw,32px);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.meeting .sheet-head h2{font-size:clamp(28px,4.5vw,46px)}
.head-left{display:grid;gap:6px;min-width:0;flex:1 1 320px}
.head-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bigpct{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.bigpct small{font-size:14px;color:var(--muted);font-weight:600;margin-left:2px}
.meet-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meet-nav .mono{color:var(--muted);min-width:60px;text-align:center}
.routebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px clamp(12px,2.5vw,24px) 14px}
.routebox .rb-foot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}

.agenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.ag{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.ag ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.ag li{display:grid;gap:1px}
.ag li b{font-weight:600}
.ag li span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ag .none{font-size:13.5px;color:var(--muted)}

.phase{display:grid;gap:10px}
.phase-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.phase-h h3{font-size:19px;font-weight:600}
.steps{list-style:none;margin:0;padding:0 0 0 30px;display:grid;gap:8px;position:relative}
.steps::before{content:"";position:absolute;left:10px;top:18px;bottom:18px;width:2px;background:var(--line)}
.when{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);margin-left:6px}
.ed-row .when-in{flex:0 1 190px;font-weight:400}
.step{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.step.s-klaar{background:var(--surface-2)}
.step-name{font-weight:600}
.step::before{content:"";position:absolute;left:-27px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line-strong)}
.step.s-klaar::before{background:var(--accent);border-color:var(--accent)}
.step.s-bezig::before{background:var(--wait);border-color:var(--wait)}
.step.s-nvt::before{border-style:dashed}
.step.s-nvt .step-name{color:var(--muted);text-decoration:line-through}
.hint{font-size:13px;color:var(--muted)}
.meta{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.meta:empty{display:none}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{font-size:13px;font-weight:600;padding:6px 11px;background:var(--surface);color:var(--muted);border:0;border-left:1px solid var(--line-strong);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"][data-val="open"]{background:var(--surface-2);color:var(--ink)}
.seg button[aria-pressed="true"][data-val="bezig"]{background:var(--wait-soft);color:var(--wait-ink)}
.seg button[aria-pressed="true"][data-val="klaar"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"][data-val="nvt"]{background:var(--surface-2);color:var(--ink);text-decoration:line-through}
.seg button:disabled{cursor:not-allowed}
.step .note{grid-column:1/-1;font-size:13.5px;padding:6px 10px;background:transparent;border-color:var(--line)}
.step .note:focus{background:var(--surface)}
@media (max-width:560px){.step{grid-template-columns:1fr}}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field.wide{grid-column:1/-1}
textarea.input{resize:vertical;min-height:72px;line-height:1.45}
.section-h{font-size:19px;font-weight:600}
.danger-zone{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.danger-zone p{font-size:13.5px;color:var(--muted);flex:1 1 220px}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.more summary{cursor:pointer;font-weight:600}
details.more[open] summary{margin-bottom:14px}

/* plan editor */
.ed-phase{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.ed-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ed-row .input{flex:1 1 220px;font-weight:600}
.ed-steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ed-step{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.4fr) auto auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.ed-days{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.ed-days .input{width:70px}
.ed-btns{display:flex;gap:4px}
.icon-btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;width:30px;height:30px;cursor:pointer;display:grid;place-items:center;font-size:14px;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
@media (max-width:720px){.ed-step{grid-template-columns:1fr}}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
</style>
</head>
<body>
<div class="auth" id="auth" hidden><div class="auth-card" id="auth-card"><p class="muted">Laden…</p></div></div>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="brand">
      <h1>Intakeroute</h1>
      <p>Van een nieuw dossier in OnView tot een draaiend budgetplan, per cliënt.</p>
      <div class="userbar">Ingelogd als <b id="me-name"></b><button class="linkbtn" id="btn-pw" type="button">Wachtwoord wijzigen</button><button class="linkbtn" id="btn-logout" type="button">Uitloggen</button></div>
    </div>
    <div class="actions">
      <button class="btn" id="btn-meeting" type="button">Vergadermodus</button>
      <button class="btn" id="btn-plan" type="button">Stappenplan</button>
      <button class="btn primary" id="btn-new" type="button">Nieuw dossier</button>
    </div>
  </header>
  <section class="summary" id="summary" aria-label="Samenvatting"></section>
  <div class="toolbar">
    <input class="input" id="f-q" type="search" placeholder="Zoek op naam of dossiernummer" aria-label="Zoeken">
    <select class="select" id="f-bw" aria-label="Filter op medewerker"><option value="">Alle medewerkers</option></select>
    <label class="check"><input type="checkbox" id="f-arch"> Toon gearchiveerd</label>
    <div class="legend" aria-hidden="true"><span><i class="k"></i>Klaar</span><span><i class="b"></i>Bezig / wacht</span><span><i class="n"></i>N.v.t.</span><span><i></i>Open</span></div>
  </div>
  <main id="board" class="board" aria-live="polite"></main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
